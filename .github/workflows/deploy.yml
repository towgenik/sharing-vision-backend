name: build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: test
        run: go test ./...

      - name: build image
        run: docker build -t ghcr.io/towgenik/sharing-vision-backend:main .

      - name: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}
          tags: tag:ci

      - name: prepare deploy key
        run: |
          umask 077
          mkdir -p ~/.ssh
          echo "${{ secrets.SV_DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: wait for tailnet host
        run: |
          for i in $(seq 1 30); do
            if timeout 3 bash -c "</dev/tcp/100.121.190.61/22" 2>/dev/null; then
              echo "reachable"; exit 0
            fi
            sleep 2
          done
          echo "host unreachable"; exit 1

      - name: deploy
        run: |
          docker image save ghcr.io/towgenik/sharing-vision-backend:main | gzip \
            | ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
                -i ~/.ssh/id_deploy deploy@100.121.190.61 backend
