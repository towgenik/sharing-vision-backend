name: build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/towgenik/sharing-vision-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: test
        run: go test ./...

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: login ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,format=short

      - name: build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}
          tags: tag:ci
          ephemeral: true

      - name: prepare deploy key
        run: |
          umask 077
          mkdir -p ~/.ssh
          echo "${{ secrets.SV_DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: wait for tailnet host
        run: |
          for i in $(seq 1 30); do
            if timeout 3 bash -c "</dev/tcp/100.121.190.61/22" 2>/dev/null; then
              echo "reachable"; exit 0
            fi
            sleep 2
          done
          echo "host unreachable"; exit 1

      - name: deploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
              -i ~/.ssh/id_deploy deploy@100.121.190.61 backend
